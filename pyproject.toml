# pyproject.toml - Unified Python project configuration

# ============================================================================
# Standard Python Project Metadata (PEP 621)
# ============================================================================

[project]
name = "knowhyper"
version = "2026.8.0"
description = "KnowHyper: ieforge plugins integrating a multimodal knowledge hypergraph into language models for biomedical IE"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "tti-kde" }
]
requires-python = ">=3.12"
dependencies = [
    "primehkg==0.12.14",
    "ieforge==0.1.11",
    "pyyaml>=6.0",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.entry-points."ieforge.knowledge_injectors"]
knowhyper = "knowhyper.ieforge.injector:KnowHyperInjector"

[project.entry-points."ieforge.models"]
knowhyper_cross_attention = "knowhyper.ieforge.models:CrossAttentionKnowledgeModel"
knowhyper_parallel_text_gated = "knowhyper.ieforge.models:ParallelTextGatedKnowledgeModel"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowhyper"]

# ============================================================================
# UV Configuration (Fast Python Package Manager)
# ============================================================================
# UV uses PyTorch wheel indexes with bundled CUDA runtime
# Reference: https://docs.astral.sh/uv/guides/integration/pytorch/

[tool.uv]
managed = true

# PyTorch CUDA wheel index configuration
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

# PyTorch Geometric wheel index
[[tool.uv.index]]
name = "pytorch-geometric"
url = "https://data.pyg.org/whl/torch-2.8.0+cu126.html"
format = "flat"
explicit = true

[tool.uv.sources]
torch-scatter = { index = "pytorch-geometric" }
torch-sparse = { index = "pytorch-geometric" }
torch-cluster = { index = "pytorch-geometric" }
primehkg = { workspace = true }
ieforge = { workspace = true }

[tool.uv.workspace]
members = ["packages/ieforge", "packages/primehkg"]
# ============================================================================
# UV Dependency Groups (PEP 735)
# ============================================================================

[dependency-groups]
dev = [
    # Core ML frameworks (PyPI with bundled CUDA)
    "torch==2.8.0",
    "torchvision",
    "pytorch-lightning>=2.4",
    "hydra-core>=1.3",
    "torch-geometric",
    "torch-scatter",
    "torch-sparse",
    "torch-cluster",
    # Experiment tracking
    "wandb>=0.16",
    # Development tools
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "ty",
    "pre-commit>=4.0",
    # Provides the trailing-whitespace / end-of-file-fixer / check-yaml entry
    # points used by a pre-commit config. Installed into the dev env (rather
    # than letting pre-commit build its own venv) because virtualenv cannot
    # create environments under the NFS-backed cache dir on this cluster.
    "pre-commit-hooks>=5.0",
    # Additional ML utilities
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
]
# ============================================================================
# Shared Development Tool Configurations
# ============================================================================

[tool.ty]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.terminal]
output-format = "full"

