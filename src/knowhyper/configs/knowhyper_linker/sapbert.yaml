# @package knowledge.pipeline.injector.linker
# Dense entity linking via primehkg's SAPBERT_LINKING preset. Without `preset`,
# PrimeHKGLinker defaults to the fuzzy resolver chain (a linear scan over ~137k
# node labels, ~2.4-3.8s/mention); the dense preset uses the label_embedding_v1
# ANN sidecar (~0.3-0.5s/mention warm). Mirrors primehkg.SAPBERT_LINKING.
_target_: knowhyper.ieforge.primehkg_backend.PrimeHKGLinker
dataset: ${knowledge.dataset}
top_k: 5
# Type-guarded recall fallback: on a miss at the preset min_score (0.6), retry at
# 0.55 and accept only if the candidate's node type matches the mention's hint.
# Recovers borderline specialized chemical names (~1/3 of link misses) without the
# wrong-type noise a blind threshold drop admits. Needs the entity-type hint (set
# via the injector's mention_type_map), so it's a no-op for untyped mentions.
# Folded into the cache fingerprint (caching.yaml linker_id) — changing it recomputes.
recall_min_score: 0.55
# Abbreviation-expansion fallback: on a miss, retry linking the in-document full form (type-guarded). Needs injector.expand_abbreviations=true to populate Mention.expansion. Folded into the cache fingerprint.
expansion_fallback: false
# Strict type-match: for a typed mention, pick the highest-scored candidate whose
# node type matches the hint (not the raw top-1); on no correct-type candidate,
# treat it as a miss (falls through to recall/expansion — never seeds a wrong-type
# node). Targets the WRONG_TYPE bucket. Folded into the cache fingerprint.
strict_type_match: false
preset:
  enable_fuzzy: false
  dense_retrieve_k: 50
  rerank_weights:
    cosine: 0.7
    jaccard: 0.1
    levenshtein: 0.2
  min_score: 0.6
