# @package _global_
# Knowledge-OFF baseline for the ChemProt RE comparison: identical task/dataset/
# loss/metric and the SAME PubMedBERT backbone as khp_re, with NO knowledge
# pipeline. Backbone id comes from the `backbone` group (default pubmedbert), so
# the relation_f1 delta vs khp_re is attributable to the knowledge integration.
defaults:
  # Shared mandatory run settings (batch_size/num_workers). FIRST because Hydra
  # requires `override` entries to be last in a defaults list; `_self_` still
  # comes after, so this config's own blocks continue to win.
  - _run_defaults
  - /backbone: pubmedbert
  - override /task: re_blurb
  - override /dataset: chemprot
  - override /loss: sequence_cross_entropy
  - override /metric: relation_f1
  - _self_

model:
  _target_: ieforge.models.hf_sequence_classifier.HFSequenceClassifier
  name: pubmedbert_seq

# re_blurb omits two keys that ieforge's _build_task reads directly
# (context_strategy, window_sentences); supply the RETask defaults inline so the
# baseline trains without extra +task.* overrides — and matches khp_re's task
# config so the comparison stays fair.
task:
  context_strategy: full_text
  window_sentences: 0
