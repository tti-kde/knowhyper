# @package _global_
# khp_ddi_xattn_ev.yaml with strict_type_match ON.
#
# WHY THIS ARM EXISTS. The fusion arms link with strict_type_match OFF (the
# linker default) while the text/serialized arms set it ON, so the two families
# retrieve differently and are not directly comparable. Which setting is better
# for the fusion arms has never been measured -- it is a precision/recall
# trade-off, not an improvement. On identical validation instances:
#
#           DIRECT           empty (no link)   seeds/instance
#   DDI     37.3 -> 38.3%    2.7 -> 8.1%       1.63 -> 1.46
#   ChemProt 17.2 -> 19.5%   1.3 -> 5.0%       1.79 -> 1.58
#
# Strict typing raises the share of instances with a correctly-typed direct edge,
# and simultaneously triples-to-quintuples the share that link nothing at all.
# For an entity-view arm that consumes node attributes, losing seeds may cost more
# than the cleaner types gain -- hence measure rather than assume.
#
# Historical note: DDI's only significant ON>OFF result was measured with strict
# ON (+0.0124 t=2.33 vs +0.0090 t=1.40 n.s. for plain-ON), but that was the
# structure-only arm, and it does not transfer to EV by itself.
#
# Needs its own precompute. The linker_id is byte-identical to the corresponding
# text arm's, but the retriever profile differs by `provenance_schema`, which
# records HOW each mention linked rather than WHICH nodes it linked to -- so the
# retrieved sub-hypergraphs are the same content under a different fingerprint.
defaults:
  - khp_ddi_xattn_ev.yaml
  - _self_

knowledge:
  pipeline:
    injector:
      linker:
        strict_type_match: true
