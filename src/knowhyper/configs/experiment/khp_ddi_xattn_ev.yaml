# @package _global_
# DDI Lever B: entity_attribute sub-HG augmentation + HDE conditioning.
# Inherits khp_ddi_xattn (same cache, same retrieval) but:
#   1. feature_store → composite (routes attr:* nodes to modality embeddings)
#   2. entity_view_augmenter constructed from the pinned core's entity_view tables
#   3. hde_enabled → true (FFN-conditioned V→E injection leverages new roles)
defaults:
  - khp_ddi_xattn
  - override /knowhyper_feature_store: composite
  - _self_


model:
  feature_dim: 768
  hde_enabled: true

knowledge:
  pipeline:
    injector:
      entity_view_augmenter:
        _target_: knowhyper.pipeline.entity_view_augmenter.EntityViewAugmenter
        index:
          _target_: knowhyper.pipeline.entity_view_augmenter.build_entity_view_index
          nodes_iter:
            _target_: knowhyper.pipeline.entity_view_augmenter.load_core_nodes_iter
            hub_repo_id: ${knowhyper.dataset_hub_repo}
            revision: ${knowhyper.dataset_revision}
            expected_fingerprint: ${knowhyper.dataset_fingerprint}
          source_fingerprint: ${knowhyper.dataset_fingerprint}
          skip_modalities: ["name"]
