# Span-level knowledge verifier with the ieforge 0.1.11 public span API.
_target_: knowhyper.ieforge.span_knowledge_model.SpanCrossAttentionKnowledgeModel
_recursive_: false
name: knowhyper_span_cross_attention
tokenizer_name: microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract-fulltext
hidden_size: 768
num_heads: 8
feature_dim: 768
encoder_layers: 2
encoder_heads: 4
require_knowledge: true
require_knowledge_per_instance: false
gate_init: 1.0
gate_shape: vector
fusion_norm: true
conditional_gate: true
conditional_gate_bias: -2.0
knowledge_control: real
inner:
  _target_: ieforge.models.hf_span_classifier.HFSpanClassifier
  model_name: microsoft/BiomedNLP-BiomedBERT-base-uncased-abstract-fulltext
  name: pubmedbert_span
  max_span_width: 12
  span_rep_mode: start_end
  dropout: 0.1
