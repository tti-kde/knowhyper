# `trainer=difflr` with LearningRateMonitor swapped for a no-op, for use with
# `logger=none`.
#
# difflr is the mandatory trainer for KG experiments, but it inherits
# LearningRateMonitor, which raises `MisconfigurationException: Cannot use
# LearningRateMonitor callback with Trainer that has no logger`. So
# `trainer=difflr logger=none` cannot work, and the CSVLogger it would otherwise
# force aborts training mid-run (see trainer/nolog.yaml for the full story).
#
# The monitor is REPLACED rather than removed so KnowledgeLRCallback stays at
# index 3; removing it would silently shift the index that
# `trainer.callbacks.3.knowledge_lr_mult=<N>` targets.
#
# Usage: `trainer=difflr_nolog logger=none trainer.callbacks.3.knowledge_lr_mult=10`
_target_: pytorch_lightning.Trainer

max_epochs: 10
accelerator: auto
devices: 1
precision: bf16-mixed
accumulate_grad_batches: 1
fast_dev_run: false
limit_train_batches: null
limit_val_batches: null
limit_test_batches: null

check_val_every_n_epoch: 1
val_check_interval: 1.0

log_every_n_steps: 10
enable_progress_bar: true

callbacks:
  - _target_: pytorch_lightning.callbacks.ModelCheckpoint
    dirpath: ${paths.output_dir}/checkpoints
    filename: "epoch_{epoch:03d}-${metric.monitor_label}_{${metric.monitor}:.4f}"
    monitor: ${metric.monitor}
    mode: ${metric.monitor_mode}
    save_top_k: 3
    save_last: true
    auto_insert_metric_name: false

  - _target_: pytorch_lightning.callbacks.EarlyStopping
    monitor: ${metric.monitor}
    patience: 5
    mode: ${metric.monitor_mode}

  # Index placeholder. MUST stay at index 2 so that KnowledgeLRCallback keeps
  # index 3 and every documented `trainer.callbacks.3.knowledge_lr_mult=<N>`
  # override still targets it. A bare Callback is a no-op.
  - _target_: pytorch_lightning.callbacks.Callback

  # Differential LR: knowledge branch at base_lr x knowledge_lr_mult.
  - _target_: knowhyper.ieforge.lr_groups.KnowledgeLRCallback
    knowledge_lr_mult: 1.0

deterministic: false
benchmark: true
