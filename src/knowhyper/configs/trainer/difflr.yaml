# Trainer variant that adds KnowledgeLRCallback (differential LR for the
# knowledge-fusion branch). Mirrors ieforge's trainer/default.yaml exactly, then
# appends a 4th callback. Select with `trainer=difflr`; sweep the multiplier with
# `trainer.callbacks.3.knowledge_lr_mult=<N>` (N=1.0 reproduces the single-LR
# baseline). Motivation: NER report 2026-07-02 §5.2 — the knowledge branch does
# not train at the backbone LR (2e-5); it needs a higher LR to leave init.
_target_: pytorch_lightning.Trainer

max_epochs: 10
accelerator: auto
devices: 1
precision: bf16-mixed
accumulate_grad_batches: 1
fast_dev_run: false
limit_train_batches: null
limit_val_batches: null
limit_test_batches: null

check_val_every_n_epoch: 1
val_check_interval: 1.0

log_every_n_steps: 10
enable_progress_bar: true

callbacks:
  - _target_: pytorch_lightning.callbacks.ModelCheckpoint
    dirpath: ${paths.output_dir}/checkpoints
    filename: "epoch_{epoch:03d}-${metric.monitor_label}_{${metric.monitor}:.4f}"
    monitor: ${metric.monitor}
    mode: ${metric.monitor_mode}
    save_top_k: 3
    save_last: true
    auto_insert_metric_name: false

  - _target_: pytorch_lightning.callbacks.EarlyStopping
    monitor: ${metric.monitor}
    patience: 5
    mode: ${metric.monitor_mode}

  - _target_: pytorch_lightning.callbacks.LearningRateMonitor
    logging_interval: "epoch"

  # Differential LR: knowledge branch at base_lr x knowledge_lr_mult.
  - _target_: knowhyper.ieforge.lr_groups.KnowledgeLRCallback
    knowledge_lr_mult: 1.0

deterministic: false
benchmark: true
