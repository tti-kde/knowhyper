# ieforge's ``trainer/benchmark`` minus the LearningRateMonitor callback.
#
# Pairs with ``logger=none``, and for the #202 span/BIO benchmark that pairing is
# MANDATORY, not a preference.
#
# ieforge's ``train.yaml`` ships ``logger: null``, which ``_hydra_entry.py`` turns
# into ``logger=True`` -- Lightning's *default* logger, which is ``CSVLogger``
# whenever tensorboard is absent. So the arrangement that looks like "no logging
# configured" actually selects the one logger that aborts training:
# ``_rewrite_with_new_header`` rewrites already-buffered rows against a newly
# grown header and raises ``ValueError: dict contains fields not in fieldnames:
# 'train/loss_epoch'`` at a validation-epoch end, leaving NO checkpoint.
#
# This was measured on the #202 smoke run (2026-07-31, job 2088891): three span
# cells at 10 epochs, and **BC2GM died with no checkpoint** while BC5CDR-Chem and
# BC5CDR-Disease passed epoch 1 untouched. Short local runs (1-3 epochs) never
# reached the triggering metric-key timing, so ``trainer=benchmark`` alone looked
# safe through all of Phase 0. It is not. Per-dataset, not flaky: a node packing
# 8 cells loses every cell that hits the timing.
#
# Dropping LearningRateMonitor is required because it hard-raises
# ``MisconfigurationException: Cannot use LearningRateMonitor callback with
# Trainer that has no logger``. It costs only the per-epoch LR trace, which is
# diagnostic -- optimisation, metrics and checkpoint selection are untouched.
#
# Everything else is copied verbatim from ieforge ``trainer/benchmark.yaml``
# (which itself is ``default`` plus a single weights-only checkpoint); keep it in
# sync if that file changes. The checkpoint policy is what keeps 60 cells inside
# the Lustre quota: ~500 MB/cell instead of ~2 GB.
#
# Usage: ``trainer=benchmark_nolog logger=none``
#        (requires ``hydra.searchpath=[pkg://knowhyper.configs]``)
_target_: pytorch_lightning.Trainer

max_epochs: 10
accelerator: auto
devices: 1
precision: bf16-mixed
accumulate_grad_batches: 1
fast_dev_run: false
limit_train_batches: null
limit_val_batches: null
limit_test_batches: null

check_val_every_n_epoch: 1
val_check_interval: 1.0

log_every_n_steps: 10
enable_progress_bar: true

callbacks:
  - _target_: pytorch_lightning.callbacks.ModelCheckpoint
    dirpath: ${paths.output_dir}/checkpoints
    filename: "epoch_{epoch:03d}-${metric.monitor_label}_{${metric.monitor}:.4f}"
    monitor: ${metric.monitor}
    mode: ${metric.monitor_mode}
    save_top_k: 1
    save_last: false
    # Excludes optimizer_states/lr_schedulers: ~2.0 GB -> ~500 MB per file.
    save_weights_only: true
    auto_insert_metric_name: false

  - _target_: pytorch_lightning.callbacks.EarlyStopping
    monitor: ${metric.monitor}
    patience: 5
    mode: ${metric.monitor_mode}

deterministic: false
benchmark: true
