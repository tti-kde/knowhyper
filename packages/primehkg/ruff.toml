# Ruff configuration
# https://docs.astral.sh/ruff/

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.12
target-version = "py312"

[lint]
# Enable all rules by default.
select = ["ALL"]
ignore = [
    "ANN003",  # Missing type annotation for **kwargs
    "ANN202",  # Missing return type annotation for private function
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed
    "ANN002",  # Missing type annotation for *args
    "BLE001",  # Do not catch blind exception: `Exception`
    "COM812",  # Missing trailing comma (conflicts with formatter)
    "COM819",  # Prohibited trailing comma
    "C901",    # Function is too complex
    "D100",    # Missing docstring in public module
    "D103",    # Missing docstring in public function
    "D104",    # Missing docstring in public package
    "D203",    # 1 blank line required before class docstring (conflicts with D211)
    "D213",    # Multi-line docstring summary should start at the second line (conflicts with D212)
    "D413",    # Missing blank line after last section
    "E501",    # Line too long (handled by formatter)
    "EXE002",  # The file is executable but no shebang is present
    "FBT001",  # Boolean positional arg in function definition
    "FBT002",  # Boolean default value in function definition
    "FBT003",  # Boolean positional value in function call
    "ISC001",  # Single line implicit string concatenation (conflicts with formatter)
    "ISC002",  # Multi-line implicit string concatenation
    "PLR2004", # Magic value used in comparison
    "PLR0913", # Too many arguments to function call
    "PLR0912", # Too many branches
    "PLR0915", # Too many statements
    "PLR0911", # Too many return statements
    "PLC0415", # Import outside top-level (allow lazy imports for optional dependencies)
    "Q000",    # Bad quotes inline string (conflicts with formatter)
    "Q001",    # Bad quotes multiline string (conflicts with formatter)
    "Q002",    # Bad quotes docstring (conflicts with formatter)
    "Q003",    # Avoidable escaped quote
    "RUF001",  # String contains ambiguous unicode character
    "S101",    # Use of assert detected
    "S104",    # Possible binding to all interfaces
    "S105",    # Possible hardcoded password
    "S108",    # Probable insecure usage of temp file/directory
    "S110",    # `try`-`except`-`pass` detected
    "S112",    # `try`-`except`-`continue` detected
    "SIM105",  # Use `contextlib.suppress()` instead of try-except-pass
    "TRY400",  # Use `logging.exception` instead of `logging.error`
    "W191",    # Indentation contains tabs
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.per-file-ignores]
"src/primehkg/core/dataset.py" = ["D101", "D102", "D107"]
"src/primehkg/core/hub_loader.py" = ["TC003"]
"src/primehkg/linking/pipeline.py" = ["D101", "D102", "D107", "TC001"]
"src/primehkg/linking/protocols.py" = ["D101", "D102"]
"src/primehkg/linking/resolvers.py" = ["D101", "D102", "D107", "PERF401"]
"src/primehkg/linking/embedding_index.py" = ["D101", "D102", "D107"]
"src/primehkg/linking/embedding_index_io.py" = ["D101"]
"src/primehkg/linking/presets.py" = ["D101"]
"src/primehkg/linking/sapbert.py" = ["N806"]
"src/primehkg/linking/sapbert_resolver.py" = ["D101", "D102", "D107", "TC001", "TC003"]
"src/primehkg/io/label_embedding_sidecar.py" = ["TC003"]
"src/primehkg/retrieval/defaults.py" = ["D101", "D102", "D107", "TC001"]
"src/primehkg/retrieval/vector_index.py" = ["D101", "D102", "D107"]
"src/primehkg/retrieval/vector_candidates.py" = ["D101", "D102", "D107", "TC001"]
"src/primehkg/retrieval/build.py" = ["D101", "D102", "D107", "TC001"]
"src/primehkg/retrieval/query_encode.py" = ["TC003"]
"src/primehkg/io/he_text_build_cli.py" = ["B008"]
"src/primehkg/io/he_embed_build_cli.py" = ["B008"]
"src/primehkg/io/vector_sidecar_build_cli.py" = ["B008"]
"src/primehkg/io/chemical_xref_build_cli.py" = ["B008", "TC003"]
"src/primehkg/io/audit_chemical_crosswalk_cli.py" = ["B008", "TC001", "TC003"]
"src/primehkg/io/chemical_xref_sidecar.py" = ["TC003", "D107"]
"src/primehkg/linking/chemical_xref_index.py" = ["D101", "D102", "D107", "TC003"]
"src/primehkg/linking/chemical_xref_resolver.py" = ["D101", "D102", "D107", "TC003"]
"src/primehkg/linking/chemical_xref_materialize.py" = ["D103", "TC003"]
"src/primehkg/retrieval/pipeline.py" = ["D101", "D102", "D107", "TC001", "N802"]
"src/primehkg/retrieval/protocols.py" = ["D101", "D102"]
"src/primehkg/linking/xref_index.py" = ["D102"]
"src/primehkg/session.py" = ["TC001"]
"tests/fixtures/*.py" = ["TC003"]
"src/primehkg/io/build_cli.py" = ["B008"]  # Typer uses Option() in parameter defaults
"src/primehkg/io/hf_publish.py" = ["B008"]
"src/primehkg/io/relation_census_cli.py" = ["TC003"]  # Path in Typer command signature
"src/primehkg/io/serve_cli.py" = ["TC001", "TC003"]  # Path/CandidateMode used at runtime in Typer signature + cast
"src/primehkg/io/mcp_cli.py" = ["TC001", "TC003"]  # Path/CandidateMode used at runtime in Typer signature + cast
"src/primehkg/io/subs_fetch_cli.py" = ["TC003"]  # Path used at runtime in Typer command signature
"src/primehkg/io/subs_ground_cli.py" = ["TC003"]  # Path used at runtime in Typer command signature
"src/primehkg/io/subs_dataset_cli.py" = ["TC003"]  # Path used at runtime in Typer command signature
"src/primehkg/policy/census.py" = ["TC003"]  # Path used at runtime for kg.csv I/O
"src/primehkg/service/config.py" = ["TC001", "TC003"]  # CandidateMode/Path used as runtime dataclass field types
"src/primehkg/service/artifacts.py" = ["TC003", "N818"]  # Path used as runtime dataclass field; ArtifactFingerprintMismatch name prescribed by public API
"src/primehkg/subs/grounding_mcp.py" = ["TC003"]  # Callable used at runtime in make_submit_callable return annotation
"src/primehkg/views/entity_view/schema.py" = ["TC001"]  # Polarity used as runtime pydantic field type
"scripts/check-build-sources.py" = ["T201", "INP001"]  # maintainer build-source guard CLI
"tests/**/*.py" = [
    "ANN201",  # Missing return type annotation for public function
    "ANN001",  # Missing type annotation for function argument
    "D",       # pydocstyle (docstring conventions)
    "ARG001",  # Unused function argument (e.g. fake runner signatures)
    "ARG002",  # Unused function argument
    "EM101",   # Exception must not use a string literal (fine for test stubs)
    "S106",    # Possible hardcoded password
    "SLF001",  # Private member accessed
    "TC003",   # Path only used in annotations under future annotations
    "TRY003",  # Long exception messages (fine for test stubs)
]

[format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
