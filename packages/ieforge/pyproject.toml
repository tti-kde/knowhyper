[project]
name = "ieforge"
version = "0.1.11"
description = "Research-first framework for training and evaluating information extraction models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "tti-kde" }
]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "datasets>=2.18",
    "pytorch-lightning>=2.4",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "seqeval>=1.2",
    "typer>=0.12",
    "nltk>=3.9.4",
    "numpy>=1.24",
    "wandb>=0.16",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
ieforge = "ieforge.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/src/ieforge",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ieforge"]

[tool.uv]
managed = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "torch==2.8.0",
    "torchvision",
    "pytorch-lightning>=2.4",
    "transformers>=4.40",
    "datasets>=2.18",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "seqeval>=1.2",
    "typer>=0.12",
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pre-commit>=4.2",
    "ruff>=0.6",
    "ty",
]

[tool.ty]

[tool.ty.environment]
python-version = "3.12"
python = ".venv/bin/python"

[tool.ty.terminal]
output-format = "full"

