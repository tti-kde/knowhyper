defaults:
  - task: re_blurb
  - dataset: chemprot
  - model: modernbert_sequence_classifier
  - loss: sequence_cross_entropy
  - metric: relation_f1
  - optimizer: adamw
  - scheduler: linear_warmup
  - trainer: default
  - logger: null
  - knowledge: default_none
  - augmentor: default_none
  - _self_

seed: 42
output_dir: outputs/${task.name}/${dataset.name}/${model.name}

paths:
  root_dir: ${oc.env:PWD}
  output_dir: ${paths.root_dir}/${output_dir}
