# @package _global_
knowledge:
  pipeline:
    _target_: ieforge.knowledge.core.pipeline.KnowledgePipeline
    source:
      name: fixture_corpus
      _target_: ieforge.knowledge.backends.corpus.FixtureCorpusSource
    builder:
      name: corpus
      _target_: ieforge.knowledge.backends.corpus.CorpusBuilder
      embedder:
        name: hashing
        _target_: ieforge.knowledge.backends.corpus.HashingEmbedder
        dim: 256
    retriever:
      name: dense
      _target_: ieforge.knowledge.backends.retrievers.DenseRetriever
      embedder:
        name: hashing
        _target_: ieforge.knowledge.backends.corpus.HashingEmbedder
        dim: 256
      top_k: 5
    injector:
      name: constant_prompt
      _target_: ieforge.knowledge.backends.prompts.ConstantPromptInjector
      prompt_length: 4
      hidden_size: 768
    query_builder:
      name: attribute
      _target_: ieforge.knowledge.integration.query_builders.AttributeQueryBuilder
      field: question
      metadata_fields:
        - id
  collator:
    enabled: true
    train_enabled: true
    eval_enabled: false
    name: knowledge
    _target_: ieforge.knowledge.integration.collators.KnowledgeCollator
    pipeline: ${knowledge.pipeline}
    prompt_key: knowledge_prompt_embeds
    prompt_attention_mask_key: knowledge_prompt_attention_mask
