defaults:
  - task: ner
  - dataset: blurb_ner_bc5cdr_chem
  - train_dataset: null
  - model: modernbert_token_classifier
  - loss: token_cross_entropy
  - metric: entity_f1
  - optimizer: adamw
  - scheduler: linear_warmup
  - trainer: default
  - logger: null
  - knowledge: default_none
  - augmentor: default_none
  - experiment: ner
  - _self_

seed: 42
output_dir: outputs/${task.name}/${dataset.name}/${model.name}

paths:
  root_dir: ${oc.env:PWD}
  output_dir: ${paths.root_dir}/${output_dir}
